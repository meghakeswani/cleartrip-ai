<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trippy v2 Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Cleartrip-style tokens (approximated from public screens; concept only) */
:root{
  --o:#FF4F17; --o-d:#E5430F; --o-soft:#FFF1EB; --o-line:#FFD4C4;
  --ink:#1A1A1A; --ink2:#4D4D4D; --ink3:#808080; --line:#E6E6E6; --line2:#F0F0F0;
  --bg:#F6F7F9; --card:#fff; --tint:#F2F6FD; --blue:#3366CC;
  --ok:#11875D; --ok-soft:#E6F5EE; --warn:#A35A00; --warn-soft:#FFF4E0; --err:#D23B2F; --err-soft:#FDECEA;
  --ai:#5B3FD9; --ai-soft:#F1EDFF; --ai-line:#DCD3FF;
  --elite:linear-gradient(90deg,#F2477E,#FF7A59);
  --sh:0 2px 12px rgba(0,0,0,.06); --sh2:0 6px 24px rgba(0,0,0,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:14px/1.45 Inter,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;background:#DCE0E5}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* stage: laptop = full window, phone = framed */
.stage{position:fixed;inset:0;overflow:hidden;background:var(--bg);container-type:inline-size;container-name:app}
body.phone .stage{position:relative;inset:auto;width:390px;height:min(844px,calc(100vh - 40px));margin:20px auto;border-radius:40px;box-shadow:0 0 0 10px #111,0 30px 80px rgba(0,0,0,.3)}
#app{height:100%;overflow-y:auto;background:var(--bg);scrollbar-width:thin}
body.phone #app{scrollbar-width:none}
body.phone #app::-webkit-scrollbar{display:none}

/* prototype toolbar (outside the product) */
.tool{position:fixed;right:14px;bottom:14px;z-index:50;display:flex;gap:6px;align-items:center;background:#111;color:#fff;border-radius:14px;padding:6px;box-shadow:var(--sh2);font-size:12.5px}
.tool b{padding:0 6px 0 4px;font-weight:600;color:#bbb}
.tool button{padding:6px 10px;border-radius:9px;color:#ddd}
.tool button.on{background:#fff;color:#111;font-weight:600}
.tool .sep{width:1px;height:20px;background:#333}
.menu{position:fixed;right:14px;bottom:62px;z-index:51;background:#fff;border-radius:14px;box-shadow:var(--sh2);padding:6px;width:250px;max-height:70vh;overflow:auto}
.menu button{display:flex;gap:8px;width:100%;text-align:left;padding:8px 10px;border-radius:8px;font-size:13px}
.menu button:hover{background:var(--bg)}
.menu small{color:var(--ink3);font:600 10.5px Inter;letter-spacing:.08em;text-transform:uppercase;padding:8px 10px 4px;display:block}
.disclaimer{font-size:11px;color:var(--ink3);text-align:center;padding:18px 16px 90px}

/* visibility by container width */
@container app (max-width: 859px){.d-only{display:none!important}}
@container app (min-width: 860px){.m-only{display:none!important}}

/* ---------- shared atoms ---------- */
.logo{display:flex;align-items:center;gap:6px;font-weight:800;font-size:20px;color:var(--o);letter-spacing:-.03em}
.logo .mk{width:20px;height:20px;border-radius:5px;background:var(--o);display:grid;place-items:center}
.logo .mk svg{width:14px;height:14px;stroke:#fff;stroke-width:3}
.concept{font:500 10.5px Inter;color:var(--ink3);border:1px solid var(--line);border-radius:20px;padding:1px 7px;margin-left:6px;letter-spacing:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:12px 18px;font-weight:600;transition:transform .12s,background .15s,opacity .2s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--o);color:#fff}
.btn.pri:hover{background:var(--o-d)}
.btn.sec{background:#fff;border:1px solid var(--line)}
.btn.sec:hover{border-color:#bbb}
.btn.ai{background:var(--ai);color:#fff}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.link{color:var(--blue);font-weight:600;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 12px;font-size:13px;transition:all .15s;text-align:left}
.chip:hover{border-color:#aaa}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .rec{font-size:10.5px;font-weight:700;color:var(--ai);background:var(--ai-soft);border-radius:10px;padding:1px 6px}
.chip.on .rec{background:rgba(255,255,255,.18);color:#fff}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;border-radius:6px;padding:2px 7px}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.no{background:var(--err-soft);color:var(--err)}
.tag.ai{background:var(--ai-soft);color:var(--ai)} .tag.o{background:var(--o);color:#fff} .tag.g{background:var(--bg);color:var(--ink2)}
.tag svg{width:12px;height:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px}
.ai-mark{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ai)}
.ai-mark .d{width:22px;height:22px;border-radius:50%;background:var(--ai-soft);display:grid;place-items:center}
.ai-mark .d svg{width:13px;height:13px}
.muted{color:var(--ink2)} .faint{color:var(--ink3)}
.h1{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.h2{font-size:18px;font-weight:700;letter-spacing:-.01em}
.h3{font-size:15px;font-weight:700}
.sec-t{font:700 11px Inter;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}

/* ---------- mobile chrome ---------- */
.mh{display:flex;align-items:center;gap:10px;padding:14px 16px;background:#fff}
.mh .coins{margin-left:auto;display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;padding:5px 10px;font-weight:600;font-size:13px}
.mh .coins i{width:16px;height:16px;border-radius:50%;background:#FFC83D;display:block}
.elite{background:var(--elite);color:#fff;border-radius:20px;padding:5px 12px;font-weight:800;font-size:12px;line-height:1;text-align:center}
.elite small{display:block;font-size:7.5px;font-weight:700;letter-spacing:.06em}
.mtop{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line)}
.mtop .t{flex:1;min-width:0}.mtop b{display:block;font-size:15px}.mtop small{color:var(--ink3);font-size:12px}
.ib{width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.ib:hover{background:var(--bg)}
.bnav{position:sticky;bottom:0;z-index:6;display:flex;background:#1A1A1A;color:#aaa;padding:8px 4px 12px}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:#aaa}
.bnav button.on{color:#fff}
.bnav svg{width:22px;height:22px}

/* ---------- desktop chrome ---------- */
.dh{background:#fff;border-bottom:1px solid var(--line)}
.dh .in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:22px;padding:12px 24px;font-size:13px}
.dh nav{margin-left:auto;display:flex;align-items:center;gap:20px;color:var(--ink2)}
.dh nav span{display:flex;align-items:center;gap:6px}
.dh nav svg{width:15px;height:15px}
.dtabs{background:var(--tint);border-bottom:1px solid var(--line2)}
.dtabs .in{max-width:1120px;margin:0 auto;display:flex;justify-content:center;gap:10px;padding:12px 24px}
.dtabs button{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:24px;font-weight:500;font-size:14px}
.dtabs button .ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff}
.dtabs button .ic svg{width:15px;height:15px}
.dtabs button.on{background:#fff;box-shadow:var(--sh);font-weight:600}
.dtabs .new{font-size:9.5px;font-weight:700;color:#fff;background:var(--o);border-radius:6px;padding:1px 5px}

/* ---------- page frame ---------- */
.wrap{padding:16px 16px 24px}
@container app (min-width:860px){
  .wrap{max-width:1120px;margin:0 auto;padding:28px 24px 40px}
  .wrap.narrow{max-width:760px}
  .cols{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:start}
  .cols aside{position:sticky;top:16px;display:grid;gap:14px}
}
.dtitle{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.foot{position:sticky;bottom:0;z-index:5;background:#fff;border-top:1px solid var(--line);padding:10px 16px 14px}
@container app (min-width:860px){.foot.m-foot{display:none}.foot{background:linear-gradient(transparent,var(--bg) 30%);border:0;max-width:760px;margin:0 auto;padding:18px 24px 20px}}
@container app (min-width:860px){.grab{display:none}}
details.area summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
details.area summary::-webkit-details-marker{display:none}
details.area[open] summary .chev{transform:rotate(90deg)}

/* ---------- home ---------- */
.hero-ai{margin:6px 16px 0;border-radius:18px;padding:16px;background:linear-gradient(135deg,#fff 0%,#FFF6F2 60%,#F5F1FF 100%);border:1.5px solid var(--o-line);position:relative;box-shadow:var(--sh)}
.hero-ai .new{position:absolute;top:-10px;right:16px}
.hero-ai h2{font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.2;margin:8px 0 4px}
.fake-in{margin-top:12px;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 12px}
.fake-in textarea{flex:1;border:0;outline:0;resize:none;font-size:14px;height:42px;background:transparent;padding-top:2px}
.go{width:38px;height:38px;border-radius:10px;background:var(--o);color:#fff;display:grid;place-items:center;flex:none}
.go:disabled{background:#E2E2E2}
.who{display:flex;gap:6px;margin-top:10px}
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;padding:14px 16px}
.tile{grid-column:span 3;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--sh);text-align:left;position:relative}
.tile.s{grid-column:span 2;padding:12px}
.tile .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;margin-bottom:10px}
.tile.s .ic{width:36px;height:36px}
.tile b{display:block;font-size:17px;font-weight:600}.tile.s b{font-size:15px}
.tile span{font-size:12.5px;color:var(--ink3)}
.tile .bad{position:absolute;top:-9px;right:12px;font-size:10.5px}
.promo{margin:0 16px 16px;border-radius:16px;height:150px;background:linear-gradient(120deg,#2F4858 0%,#3E7C8C 60%,#F2A65A 100%);color:#fff;padding:16px;display:flex;flex-direction:column;justify-content:flex-end}
.promo b{font-size:20px}
.dhome{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.dcard{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:22px}
.dcard textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:15px;resize:none;height:76px;outline:0}
.dcard textarea:focus{border-color:var(--o)}
.radio{display:flex;gap:18px;margin-bottom:14px}
.radio button{display:flex;gap:8px;align-items:center;font-size:14px}
.radio i{width:16px;height:16px;border-radius:50%;border:1.5px solid #999;display:block}
.radio .on i{border:5px solid var(--ink)}
.dest{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:22px}
.dest div{height:120px;border-radius:12px;padding:12px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;font-weight:700}
.dest small{font-weight:500;opacity:.9}

/* ---------- chat-ish flow ---------- */
.msg-u{align-self:flex-end;max-width:85%;background:var(--ink);color:#fff;border-radius:16px 16px 4px 16px;padding:10px 14px}
.thread{display:flex;flex-direction:column;gap:14px}
.bub{background:#fff;border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:14px}
.q{margin-top:14px}
.q label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.q p{font-size:12px;color:var(--ink3);margin-bottom:8px}
.q .chips{display:flex;flex-wrap:wrap;gap:6px}
.steps{display:grid;gap:9px}
.step{display:flex;gap:10px;font-size:13.5px;color:var(--ink2);animation:rise .3s ease both}
.step .s{width:18px;height:18px;border-radius:50%;flex:none;display:grid;place-items:center;margin-top:1px}
.step.done .s{background:var(--ok-soft);color:var(--ok)}
.step.done .s svg{width:11px;height:11px;stroke-width:3}
.step.now{color:var(--ink);font-weight:500}
.step.now .s{border:2px solid var(--ai-soft);border-top-color:var(--ai);animation:spin .8s linear infinite}
.skel{height:84px;border-radius:14px;background:linear-gradient(90deg,#EEE 0%,#F7F7F7 40%,#EEE 80%);background-size:200% 100%;animation:shimmer 1.2s linear infinite;margin-top:12px}

/* ---------- results ---------- */
.sum{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.sum .r{display:flex;justify-content:space-between;align-items:baseline}
.sum b.big{font-size:20px;letter-spacing:-.01em}
.bar{height:6px;border-radius:6px;background:var(--line2);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:var(--ok);transition:width .5s}
.bar.over i{background:var(--err)}
.left{font-size:12px;margin-top:6px;color:var(--ok);font-weight:600}
.left.over{color:var(--err)}
.tabs{display:flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px;margin:14px 0 4px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1;padding:9px 10px;border-radius:9px;font-weight:600;font-size:13px;color:var(--ink2);white-space:nowrap}
.tabs button.on{background:var(--ink);color:#fff}
.tabs .n{font-size:11px;opacity:.7;margin-left:3px}
.tabhint{font-size:12.5px;color:var(--ink3);margin:6px 2px 10px}
.rules{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rule{font-size:12px;background:var(--ai-soft);color:var(--ai);border-radius:20px;padding:3px 10px;font-weight:600;display:inline-flex;gap:4px;align-items:center}
.rule svg{width:12px;height:12px}
.also{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;margin-top:10px}
.block{margin-top:16px}
.bhead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.zone{width:10px;height:10px;border-radius:50%;flex:none}
.z-wt{background:var(--ok)} .z-av{background:#E3A008} .z-pb{background:#3B82F6} .z-bs{background:var(--err)}
.bhead b{font-size:14px}.bhead .faint{font-size:12px}
.tl{position:relative;padding-left:66px}
.tl::before{content:"";position:absolute;left:52px;top:6px;bottom:6px;width:2px;background:var(--line)}
.it{position:relative;margin-bottom:10px}
.it .tm{position:absolute;left:-66px;top:12px;width:42px;text-align:right;font-size:12px;font-weight:600;color:var(--ink2)}
.it .dot{position:absolute;left:-19px;top:15px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--ink3)}
.it.opt .dot{border-style:dashed}
.icard{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:border-color .2s,box-shadow .2s}
.icard.locked{border-color:#BDBDBD;background:#FCFCFC}
.icard.flash{animation:flash 1.2s ease}
.icard .mn{display:flex;gap:12px;padding:12px 12px 10px}
.icard .ic{width:34px;height:34px;border-radius:10px;background:var(--bg);display:grid;place-items:center;flex:none;color:var(--ink2)}
.icard .bd{flex:1;min-width:0}
.icard .meta{font-size:11.5px;color:var(--ink3)}
.icard .meta .yours{color:var(--o);font-weight:700}
.icard h4{font-size:14.5px;line-height:1.3;font-weight:600}
.icard .sub{font-size:12.5px;color:var(--ink2)}
.icard .pr{font-weight:700;font-size:14px;white-space:nowrap}
.icard .pr.free{color:var(--ok);font-size:12.5px;font-weight:600}
.icard .pr.pay{color:var(--ink3);font-size:12px;font-weight:500}
.sig{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.note{display:flex;gap:6px;font-size:12px;margin-top:6px;padding:6px 8px;border-radius:8px;background:var(--ai-soft);color:#3B2A9A}
.note svg{width:14px;height:14px;flex:none;margin-top:1px;color:var(--ai)}
.note.warn{background:var(--warn-soft);color:#5C3300}.note.warn svg{color:var(--warn)}
.note.no{background:var(--err-soft);color:#7A1E17}.note.no svg{color:var(--err)}
.acts{display:flex;border-top:1px solid var(--line2)}
.acts button{flex:1;padding:9px 0;font-size:12.5px;font-weight:600;color:var(--ink2);display:flex;gap:6px;align-items:center;justify-content:center}
.acts button+button{border-left:1px solid var(--line2)}
.acts button:hover{background:var(--bg)}
.acts button.on{color:var(--ai)}
.acts button:disabled{color:#C8C8C8;cursor:not-allowed;background:none}
.acts svg{width:15px;height:15px}
.why{background:var(--ai-soft);padding:12px 14px;font-size:13px;color:#2E2275;border-top:1px solid var(--ai-line);animation:open .25s ease}
.why h6{font:700 10.5px Inter;letter-spacing:.07em;text-transform:uppercase;color:var(--ai);margin-bottom:4px}
.why .alt{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:8px 0;border-top:1px solid var(--ai-line);font-size:12.5px}
.why .alt:first-of-type{margin-top:8px}
.why .alt span{grid-column:1/-1;color:#5B5290}
.why .src{margin-top:8px;font-size:11px;color:#7A70B8}
.travel{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink3);margin:-2px 0 10px}
.travel svg{width:14px;height:14px}
.local{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink2);padding:8px 2px}
.area{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.area .row{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line2);font-size:12.5px}
.area .row:first-of-type{border-top:0}
.area .row b{display:block;font-size:13px}
.area .row .zone{margin-top:5px}
.seg{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.seg button{font-size:11.5px;padding:5px 9px;border-radius:16px;border:1px solid var(--line);background:#fff}
.seg button.on{background:var(--ai);border-color:var(--ai);color:#fff}
.banner{border-radius:14px;padding:12px 14px;margin-top:12px;animation:rise .3s ease both}
.banner.err{background:var(--err-soft);color:#7A1E17}
.banner h5{font-size:14px;display:flex;gap:6px;align-items:center}
.banner p{font-size:12.5px;margin-top:2px}
.fix{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border-radius:10px;padding:10px 12px;margin-top:8px;border:1px solid transparent}
.fix:hover{border-color:#F2B8B3}
.fix b{font-size:13px;display:block}.fix span{font-size:12px;color:var(--ink2)}.fix .w{color:var(--warn)}
.fix em{font-style:normal;font-weight:700;color:var(--ok);font-size:13px;white-space:nowrap}
.fix em.part{color:var(--ink3)}

/* map */
.mapc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.mapc .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mapc .dchips{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.mapc .dchips .chip{font-size:12px;padding:5px 10px}
.map{width:100%;height:auto;display:block;border-radius:12px;margin-top:10px;background:#EEF1EC}
.map .pin{cursor:pointer}
.map .pin:hover circle{stroke:var(--o)}
.map .drop{animation:pinIn .45s cubic-bezier(.2,1.4,.4,1) both}
.map .draw{stroke-dashoffset:0;animation:fade .6s ease both}
.legend{display:flex;gap:12px;font-size:11.5px;color:var(--ink2);margin-top:8px;flex-wrap:wrap;align-items:center}
.legend i{display:inline-block;width:18px;height:0;border-top:2.5px solid var(--o);vertical-align:middle;margin-right:4px}
.legend i.w{border-top:2.5px dotted var(--ai)}.legend i.f{border-top:2.5px dashed #2B7BD6}
.nt{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--ink2)}

.pkg .bd{padding:12px 14px}

.pkg ul{list-style:none;display:grid;gap:4px;margin-top:8px}
.pkg li{display:flex;gap:6px;font-size:12.5px}
.pkg li svg{width:14px;height:14px;margin-top:2px}
.pkg .ft{display:flex;gap:8px;margin-top:12px}

.subtabs{display:flex;gap:6px;margin-bottom:10px}
.lrow{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.lrow .bd{flex:1;min-width:0}
.lrow h4{font-size:14px;font-weight:600}
.lrow .sub{font-size:12.5px;color:var(--ink2)}
.lrow .pr{font-weight:700;text-align:right}
.add{margin-top:6px;border:1px solid var(--o);color:var(--o);border-radius:8px;padding:5px 12px;font-weight:600;font-size:12.5px}
.add.on{background:var(--o);color:#fff}
.cart{position:sticky;bottom:0;margin-top:8px;background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;z-index:4}
.cart .grow{flex:1}
.cart small{display:block;color:#bbb;font-size:12px}
.check{background:#fff;border:1px solid var(--ai-line);border-radius:14px;padding:12px 14px;margin-top:10px}

/* sheet */
.scrim{position:absolute;inset:0;background:rgba(16,18,22,.45);z-index:20;animation:fade .2s ease both}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow:auto;background:#fff;border-radius:20px 20px 0 0;z-index:21;padding:8px 16px 18px;animation:up .3s cubic-bezier(.2,.8,.2,1) both}
@container app (min-width:860px){.sheet{left:auto;right:0;top:0;bottom:0;width:440px;max-height:none;border-radius:0;animation:side .3s cubic-bezier(.2,.8,.2,1) both}}
.grab{width:40px;height:4px;background:#DDD;border-radius:4px;margin:0 auto 12px}
.fl{display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none}
.fl .chip{font-size:12px;padding:5px 10px;white-space:nowrap}
.alt-row{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px;background:#fff;transition:border-color .15s}
.alt-row:hover{border-color:#999}
.alt-row.cur{border:2px solid var(--ink)}
.alt-row .r{display:flex;justify-content:space-between;gap:8px}
.delta{font-weight:700;font-size:13px;white-space:nowrap}
.delta.up{color:var(--err)}.delta.down{color:var(--ok)}.delta.same{color:var(--ink3);font-weight:500}

.list{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.li{display:flex;gap:10px;align-items:center;padding:12px 14px;font-size:13.5px}
.li+.li{border-top:1px solid var(--line2)}

.li small{display:block;color:var(--ink3);font-size:12px}
.st{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none}
.st.ok{background:var(--ok-soft);color:var(--ok)}.st.ok svg{width:12px;height:12px;stroke-width:3}

.st.bad{background:var(--err-soft);color:var(--err)}.st.bad svg{width:12px;height:12px;stroke-width:3}

.promise{margin-top:14px;display:flex;gap:10px;padding:12px 14px;border-radius:14px;background:var(--ai-soft);color:#2E2275;font-size:13px}
.promise svg{color:var(--ai)}
.hold{font:700 12px Inter;color:var(--o);background:var(--o-soft);border-radius:20px;padding:4px 10px;display:inline-block}
.done-hero{text-align:center;padding:24px 0 8px}

.done-hero .big svg{width:30px;height:30px;stroke-width:2.6}
.toggle{display:flex;gap:12px;align-items:center;padding:12px 14px}
.toggle+.toggle{border-top:1px solid var(--line2)}
.toggle .grow{flex:1;font-size:13.5px}
.toggle small{display:block;color:var(--ink3);font-size:12px}
.sw{width:42px;height:26px;border-radius:20px;background:#D5D5D5;position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.sw.on{background:var(--ok)}.sw.on::after{transform:translateX(16px)}

.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;flex:none;border:2px solid #fff}

.range{position:relative;height:36px;margin-top:12px}
.range .ln{position:absolute;left:0;right:0;top:16px;height:4px;background:var(--line2);border-radius:4px}
.range .band{position:absolute;top:14px;height:8px;border-radius:6px;background:var(--o-soft);border:1px solid var(--o-line)}
.range .av{position:absolute;top:2px;transform:translateX(-50%)}
.vote{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}

.vote .bar i{background:var(--o)}
.gnote{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;background:#fff;border:1px solid var(--line);margin-bottom:8px;font-size:13px}
.gnote .ic{width:32px;height:32px;border-radius:10px;background:var(--o-soft);color:var(--o);display:grid;place-items:center;flex:none}
.gnote b{display:block;font-size:13.5px}

.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:90px;width:min(420px,calc(100% - 32px));background:var(--ink);color:#fff;padding:11px 14px;border-radius:12px;font-size:13px;z-index:30;animation:rise .25s ease both;display:flex;gap:8px}
.toast svg{width:16px;height:16px;color:#7EE2B8;margin-top:1px}

@keyframes rise{from{opacity:0;transform:translateY(8px)}}

@keyframes side{from{transform:translateX(100%)}}

function judge(slot,a){
 const p=S.prefs.late;
 if(slot==='out'||slot==='ret'){
  if(a.home){ if(a.arr>22) return {lv:p==='late'?'ok':'warn',t:'Gets you home around midnight before a work day.'}; return {lv:'ok',t:null}; }
  const ar=AREAS[a.zone];
  if(a.cost) return {lv:'warn',t:a.cost};
  if(p==='sunset'&&a.arr>SUNSET) return {lv:'warn',t:`Lands at ${hm(a.arr)}, after sunset. You asked to be back by sunset.`};
  if(a.arr>ar.busyTill) return {lv:p==='late'?'warn':'no',t:`Arrives ${hm(a.arr)} at the ${ar.short.toLowerCase()}, which is quiet after ${hm(ar.busyTill)}. ${ar.src}.`};
  if(a.arr>SUNSET) return {lv:'ok',t:`Lands after dark, but it’s 20 min to ${ar.short} on the main road, and ${ar.short} stays busy until about ${hm(ar.busyTill)}.`};
  return {lv:'ok',t:null};
 }
 if(slot==='stay'){
  if(a.zone==='bs') return {lv:'no',t:'Quiet street after 21:00. 2 women reviewers felt uneasy walking back at night.'};
  if(a.zone==='av') return {lv:'warn',t:'Roads are unlit after 19:00, so you’d need a cab every evening.'};
  if(a.dorm&&S.prefs.stay==='private') return {lv:'warn',t:'Shared dorm, and you asked for a private room.'};
  return {lv:'ok',t:null};
 }
 if(a.eve&&p==='sunset') return {lv:'warn',t:'This is after sunset. Keep it, or swap for a daytime plan?'};
 return {lv:'ok',t:null};
}
function whyFor(id){
 if(id!=='out') return ITEMS[id].why;
 const a=cur('out'),p=S.prefs.late;
 if(S.choice.out===0){
  if(p==='area') return 'You asked me to judge late arrivals by area, not by a fixed time. Puducherry airport is 20 minutes from White Town on the main road, and White Town stays busy until about 22:30, so landing at 21:10 is fine here. It’s ₹550 cheaper than the 17:45 flight. If you’d rather land in daylight, swap it.';
  if(p==='busy') return 'You’re fine with evenings in busy areas. Landing at 21:10 means a 20-minute taxi on the main road into White Town, which is busy until about 22:30. ₹550 cheaper than the 17:45 flight.';
  return 'The cheapest direct flight that still lands at a sensible hour. ₹550 cheaper than the 17:45 flight.';
 }
 if(S.choice.out===1) return p==='sunset'?'You asked to be back by sunset, so I picked the flight that lands at 17:45, before it gets dark (sunset 17:52).':'Lands in daylight at 17:45. It costs ₹550 more than the 21:10 flight.';
 return 'You picked this over my suggestion. I’ve kept the rest of the plan and updated anything that depends on it.';
}

  <button class="btn sec block" style="margin-top:8px" data-a="toast" data-v="Opens WhatsApp share (not built here).">${I('share')}Share on WhatsApp</button></div>
 <div class="sec-t" style="margin:18px 0 6px">${n} of 5 answered</div>
 <div class="card" style="padding:4px 14px">${G.map(m=>`<div class="mem">${av(m)}<div class="grow"><b style="font-size:13.5px">${m.n}</b><div class="faint" style="font-size:12px">${m.st==='wait'?'Hasn’t answered yet':m.st==='host'?'Trip host':`${LATE[m.late]} · budget kept private`}</div></div>${m.st==='wait'?`<button class="link" data-a="nudge">Nudge</button>`:`<span class="tag ok">${I('check')}Done</span>`}</div>`).join('')}</div>
 <div class="card" style="padding:14px;margin-top:12px"><div class="sec-t">What friends see</div><p class="muted" style="font-size:13px;margin-top:6px">“Megha’s planning a girls’ weekend 🌊 Pick your dates, your budget and how late you’re okay being out. Takes 30 seconds.”</p></div>`,
 foot:`<button class="btn pri block" data-a="go" data-v="gsync">See what works for everyone · ${n} of 5</button>`});};
V.gsync=()=>{const G=GROUP.slice(0,4).concat(S.tanvi?[{...GROUP[4],st:'done',b:11000,days:[1,1,1,0],late:'busy'}]:[]);
 const days=['Fri 13','Sat 14','Sun 15','Mon 16'];const min=Math.min(...G.map(m=>m.b)),max=Math.max(...G.map(m=>m.b));const pos=b=>((b-8000)/(20000-8000))*100;
 return page({title:'What works for everyone',sub:`${G.length} of 5 answered`,back:'ginvite',narrow:1,body:`
 <div class="card" style="padding:16px"><b class="h3">${I('cal')} Dates</b><div class="days">${days.map((d,i)=>{const free=G.filter(m=>m.days[i]);const all=free.length===G.length;return `<div class="${all?'ok':''}"><b>${d}</b>${free.length}/${G.length}<div class="avs">${free.map(m=>av(m,1)).join('')}</div></div>`;}).join('')}</div>

  <div style="display:grid;gap:6px;margin-top:8px"><button class="fix" style="border-color:var(--line)" data-a="toast" data-v="Got it. The plan keeps Fri–Sun and Sana joins Saturday morning."><div><b>Go Fri–Sun. Sana joins Saturday morning</b><span>06:30 bus, arrives 11:00 in daylight · ₹650 · live location shared with the group</span></div><em>Recommended</em></button>
  <button class="fix" style="border-color:var(--line)" data-a="toast" data-v="Noted. Not built further in this prototype."><div><b>Everyone goes Sat–Sun only</b><span>1 night instead of 2</span></div></button></div></div>
 <div class="card" style="padding:16px;margin-top:12px"><b class="h3">${I('wallet')} Budget per person</b><div class="range"><div class="ln"></div><div class="band" style="left:${pos(min)}%;width:${pos(max)-pos(min)}%"></div>${G.map(m=>`<span class="av sm" style="background:#9AA0A6;left:${pos(m.b)}%"></span>`).join('')}</div>
  <div style="display:flex;justify-content:space-between;font-size:12px" class="faint"><span>₹8,000</span><span>Budgets are anonymous, even to the host</span><span>₹20,000</span></div>
  <div class="note" style="margin-top:8px">${I('spark')}<span>I’ll plan around <b>${fmt(min)} each</b>, the lowest budget, without saying whose. Anyone can add upgrades for themselves.</span></div></div>
 <div class="card" style="padding:16px;margin-top:12px"><b class="h3">${I('moon')} Comfort</b>
  <ul style="list-style:none;display:grid;gap:6px;margin-top:8px;font-size:13px"><li>✓ Everyone is fine with <b>evenings in busy areas</b>, except Sana, who prefers back by sunset. I’ll keep late plans walkable from the stay so she can head back early.</li><li>✓ <b>Rooms on the same floor</b> and a stay with reviews from women’s groups</li><li>✓ No overnight buses (2 of you said so)</li></ul></div>`,
 foot:`<button class="btn pri block" data-a="go" data-v="gvote">Plan 2 options for us to vote on</button>`});};
V.gvote=()=>{const opts=[{k:'p',name:'Pondicherry',pp:9850,hi:'Sea, cafés, walkable old town · 2 rooms on one floor',votes:[0,1,3]},{k:'g',name:'Gokarna',pp:8900,hi:'Quiet beaches, hostels · women-only dorm for 5',votes:[2]}];
 const v=S.vote;const cnt=o=>o.votes.length+(v===o.k?1:0);
 return page({title:'Vote on your trip',sub:'Voting closes in 6 hours',back:'gsync',narrow:1,body:`
 ${aiMark()}<p class="muted" style="margin:6px 0 12px">Both fit everyone’s dates, the ${fmt(10000)} budget and your comfort rules. Tap to vote.</p>
 ${opts.map(o=>`<button class="vote ${v===o.k?'win':''}" data-a="vote" data-v="${o.k}"><div style="display:flex;justify-content:space-between"><b class="h3">${o.name}</b><b>${fmt(o.pp)} <span class="faint" style="font-weight:500;font-size:12px">/ person</span></b></div><p class="muted" style="font-size:13px">${o.hi}</p>
  <div style="display:flex;align-items:center;gap:10px;margin-top:10px"><div class="bar" style="flex:1;margin:0"><i style="width:${cnt(o)/5*100}%"></i></div><div class="avs">${o.votes.map(i=>av(GROUP[i],1)).join('')}${v===o.k?av(GROUP[0],1):''}</div><b style="font-size:13px">${cnt(o)}</b></div></button>`).join('')}
 <p class="faint" style="font-size:12px">Votes are visible to the group. Tanvi hasn’t voted yet.</p>`,
 foot:`<button class="btn pri block" data-a="go" data-v="gplan" ${v?'':'disabled'}>${v?'Build the group plan':'Vote to continue'}</button>`});};
V.gplan=()=>page({title:'Pondicherry · 5 friends',sub:'Fri 13 – Sun 15 Nov · Sana joins Saturday',back:'gvote',body:`
 <div class="sum"><div class="r"><b class="big">₹9,850 <span class="faint" style="font-size:13px;font-weight:500">per person</span></b><span class="tag ok">Under everyone’s budget</span></div><p class="faint" style="font-size:12px;margin-top:4px">₹49,250 for the group · each friend pays her own share by link</p></div>
 <div class="sec-t" style="margin:16px 0 8px">What’s different for a group</div>
 ${[['bed','2 rooms on the same floor, Villa Selene','3 + 2 beds · reviews from 6 women’s groups · host checks everyone in until 23:00'],['plane','Travel together, except Sana','4 of you on the 19:55 flight · Sana on the Sat 06:30 bus (arrives 11:00) with live location to the group'],['car','One 7-seater cab for the airport and Auroville','₹1,600 split 5 ways · no one waits alone for an auto'],['users','Everyone / optional plans','Sunset walk and dinner for all · cycling trail optional (3 interested)'],['moon','Sana’s early nights, sorted','Dinner is a 5-min walk from the stay, so she can head back early without anyone leaving the table']].map(([i,b,t])=>`<div class="gnote"><span class="ic">${I(i)}</span><div><b>${b}</b><span class="muted">${t}</span></div></div>`).join('')}`,
 side:`<div class="sum"><b class="h3">Split</b><div class="list" style="margin-top:8px">${GROUP.map(m=>`<div class="li">${av(m,1)}<div class="grow">${m.n}</div><b>${m.n==='Sana'?'₹8,950':'₹9,850'}</b></div>`).join('')}</div><button class="btn pri block" style="margin-top:12px" data-a="gbook">Send to the group to confirm</button></div>${mapCard()}${areaGuide()}`,
 foot:`<button class="btn pri block" data-a="gbook">Send to the group to confirm</button>`});
V.gdone=()=>page({title:'Sent to the group',back:'home',narrow:1,body:`<div class="done-hero"><div class="big">${I('check')}</div><div class="h1">Waiting for 4 friends to pay</div><p class="muted">Rooms and flights are held for 2 hours. Each friend pays her own share by link.</p></div>
 <div class="card" style="padding:4px 14px">${GROUP.map((m,i)=>`<div class="mem">${av(m)}<div class="grow"><b style="font-size:13.5px">${m.n}</b></div>${i===0?`<span class="tag ok">${I('check')}Paid</span>`:`<span class="tag g">Pending</span>`}</div>`).join('')}</div>
 <p class="faint" style="font-size:12.5px;margin-top:10px">If someone drops out, I’ll re-split the room and cab costs and show everyone the new share before anything changes.</p>
 <button class="btn sec block" style="margin-top:16px" data-a="home">Back to home</button>`});

/* ---------- sheets ---------- */
function sheetHtml(){
 const sh=S.sheet;if(!sh)return'';const id=sh.id,c=cur(id),it=ITEMS[id];
 let list=ALTS[id].map((a,i)=>({a,i,j:judge(id,a)}));
 const F=S.sheetF;
 if(id==='stay'){if(F.has('match'))list=list.filter(x=>x.j.lv==='ok');if(F.has('solo'))list=list.filter(x=>x.a.rev>=5);if(F.has('u5'))list=list.filter(x=>x.a.price<5000);if(F.has('wt'))list=list.filter(x=>x.a.zone==='wt');}
 const picks=list.filter(x=>x.j.lv==='ok').slice(0,3),rest=list.filter(x=>!picks.includes(x));
 const row=x=>{const d=Math.max(0,x.a.price)-Math.max(0,c.price),isCur=x.i===S.choice[id];return `<button class="alt-row ${isCur?'cur':''}" data-a="choose" data-v="${id}:${x.i}"><div class="r"><b style="font-size:14px">${x.a.title}</b><span class="delta ${isCur?'same':d>0?'up':d<0?'down':'same'}">${isCur?'Current':d===0?'Same price':(d>0?'+':'−')+fmt(Math.abs(d))}</span></div><div class="faint" style="font-size:12.5px">${x.a.sub}${x.a.rating?` · ★ ${x.a.rating}`:''}</div>${(x.a.sig||[]).length?`<div class="sig">${x.a.sig.map(s=>`<span class="tag ok">${s}</span>`).join('')}</div>`:''}${x.j.t?`<div class="note ${x.j.lv==='ok'?'':x.j.lv}">${I(x.j.lv==='ok'?'pin':'alert')}<span>${x.j.t}</span></div>`:''}</button>`;};
 return `<div class="scrim" data-a="close"></div><div class="sheet" role="dialog" aria-label="Options for ${it.label}"><div class="grab"></div>
  <div style="display:flex;justify-content:space-between;align-items:center"><b class="h2">${id==='stay'?'Stays in Pondicherry':it.label}</b><button class="ib" data-a="close" aria-label="Close">${I('x')}</button></div>
  <p class="faint" style="font-size:12.5px">${id==='stay'?`42 stays · showing ${list.length} · I only re-plan what depends on this`:'I only re-plan what depends on this. Everything else stays.'}</p>
  ${id==='stay'?`<div class="fl">${[['match','Fits my rules'],['solo','Reviewed by solo women'],['wt','White Town'],['u5','Under ₹5,000']].map(([k,t])=>`<button class="chip ${F.has(k)?'on':''}" data-a="sf" data-v="${k}">${t}</button>`).join('')}</div>`:''}
  ${picks.length?`<div class="sec-t" style="margin-top:12px">${aiMark('My picks for you')}</div>${picks.map(row).join('')}`:''}
  ${rest.length?`<div class="sec-t" style="margin-top:16px">More options</div>${rest.map(row).join('')}`:''}
  ${!list.length?`<p class="muted" style="margin-top:16px">Nothing matches all these filters. Try removing one.</p>`:''}
  ${id==='stay'?`<button class="btn sec block" style="margin-top:14px" data-a="toast" data-v="The full list of 42 would load here.">See all 42 stays</button>`:''}
 </div>`;
}

/* ============ render ============ */
let lastRoute=null;
function render(){
 const app=document.getElementById('app');const top=app.scrollTop;
 app.innerHTML=(V[S.route]||V.home)();
 document.getElementById('overlay').innerHTML=sheetHtml()+(S.toast?`<div class="toast">${I('check')}<span>${S.toast}</span></div>`:'');
 if(lastRoute===S.route)app.scrollTop=top;else app.scrollTop=0;lastRoute=S.route;S.flash=null;
 ['prompt','prompt-d'].forEach(id=>{const ta=document.getElementById(id);if(!ta)return;ta.oninput=e=>{S.prompt=e.target.value;document.querySelectorAll('[data-a=send]').forEach(b=>b.disabled=!S.prompt.trim());const o=document.getElementById(id==='prompt'?'prompt-d':'prompt');if(o)o.value=S.prompt;};ta.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ACT.send();}};});
 renderTool();
}
function renderTool(){
 document.body.classList.toggle('phone',view==='phone');
 document.getElementById('tool').innerHTML=`<b>Trippy v2</b><button class="lap ${view==='laptop'?'on':''}" data-t="laptop">${'Laptop'}</button><button class="${view==='phone'?'on':''}" data-t="phone">Phone</button><span class="sep"></span><button data-t="menu">States ▾</button>`;
 document.getElementById('menu').innerHTML=menuOpen?`<div class="menu">${JUMPS.map((j,i)=>j[1]?`<button data-j="${i}">${j[0]}</button>`:`<small>${j[0]}</small>`).join('')}</div>`:'';
}

/* ============ actions ============ */
function parseBudget(t){const m=t.replace(/,/g,'').match(/(?:₹|rs\.?\s*)?(\d+(?:\.\d+)?)\s*(k|K|000)?/);if(!m)return 15000;let n=parseFloat(m[1]);if(m[2]&&m[2].toLowerCase()==='k')n*=1000;return n<500?15000:n;}
const ACT={
 go(v){S.sheet=null;if(v==='home')return ACT.home();S.route=v;render();},
 home(){clearT();const keep=view;S=fresh();render();},
 toast(v){toast(v);},
 who(v){S.who=v;render();},
 example(v){S.prompt=v;ACT.send();},
 send(){const t=S.prompt.trim();if(!t)return;if(S.who==='group'){S.route='ginvite';return render();}S.budget=parseBudget(t);S.route=S.budget<8000?'nofit':'clarify';render();},
 stretch(){S.budget=15000;S.prompt='₹15K, this weekend, travelling alone. Somewhere calm by the sea.';S.route='clarify';render();},
 pref(v){const[k,val]=v.split(':');S.prefs[k]=val;if(k==='late')autoOut(false);render();},
 plan(){clearT();S.route='planning';S.planStep=0;autoOut(false);render();for(let i=1;i<=6;i++)later(()=>{S.planStep=i;if(i===6)later(()=>{S.route='results';S.tab='plan';render();},500);render();},650*i);},
 tab(v){S.tab=v;render();},
 sep(v){S.sep=v;render();},
 pick(k){const id=k.split(':')[0];[...S.picks].forEach(x=>{if(x.split(':')[0]===id&&x!==k)S.picks.delete(x);});S.picks.has(k)?S.picks.delete(k):S.picks.add(k);S.checked=false;render();},
 checkpicks(){S.checked=true;render();},
 why(id){S.open.has(id)?S.open.delete(id):S.open.add(id);render();},
 lock(id){if(S.locked.has(id)){S.locked.delete(id);toast('Unlocked. I can suggest changes to this now.');}else{S.locked.add(id);toast('Locked. I won’t change this, even to save money.');}},
 swap(id){S.sheet={id};render();},
 close(){S.sheet=null;render();},
 sf(k){S.sheetF.has(k)?S.sheetF.delete(k):S.sheetF.add(k);render();},
 choose(v){const[id,i]=v.split(':');const b=total();S.choice[id]=+i;S.sheet=null;S.flash=id;S.open.delete(id);const d=total()-b;const dep=id==='out'?' I’ve moved your taxi pickup and check-in time to match.':id==='stay'?' I’ve updated pickup points for your activities.':'';toast(`Swapped (${d>=0?'+':'−'}${fmt(Math.abs(d))}).${dep}`);},
 raise(){S.budget=Math.ceil(total()/500)*500;toast(`Budget is now ${fmt(S.budget)}. Nothing else changed.`);},
 late(v){S.prefs.late=v;const ch=autoOut(true);if(!ch)toast(`Now using “${LATE[v]}”. I’ve re-checked every arrival and evening plan.`);else render();},
 mapday(v){S.mapDay=v;render();},
 night(){S.night=!S.night;render();},
 pin(id){S.tab='plan';S.open.add(id);S.flash=id;const d={out:'fri',stay:S.mapDay,sun:'sun',ret:'sun'}[id]||'sat';if(S.mapDay!=='all'&&id!=='stay')S.mapDay=d;S.route=S.route==='gplan'?'gplan':'results';render();const el=document.getElementById('it-'+id);if(el)el.scrollIntoView({behavior:'smooth',block:'center'});},
 dropmeet(){S.prefs.meet='no';toast('Removed the meetup. Your evening is unchanged otherwise.');},
 book(){S.route='booking';S.booking={step:0,conflict:false,resolved:false};render();tick();},
 resolve(i){S.choice.stay=+i;S.booking.conflict=false;S.booking.resolved=true;render();later(()=>{S.booking.step++;render();tick();},500);},
 cancelbook(){clearT();S.booking=null;S.route='results';toast('Stopped. Nothing was booked and held prices were released.');},
 tg(k){S[k]=!S[k];render();},
 nudge(){toast('Nudged Tanvi on WhatsApp.');later(()=>{S.tanvi=true;toast('Tanvi just answered.');},1600);},
 vote(k){S.vote=k;render();},
 gbook(){S.route='gdone';render();}
};
function autoOut(announce){
 const p=S.prefs.late;
 if(p==='sunset'&&S.choice.out===0&&!S.locked.has('out')){S.choice.out=1;S.flash='out';if(announce)toast('Switched to the 17:45 flight so you land in daylight (+₹550). Evening plans are flagged.');return true;}
 if(p!=='sunset'&&S.choice.out===1&&!S.locked.has('out')){S.choice.out=0;S.flash='out';if(announce)toast(`The 21:10 flight works with “${LATE[p]}”. Back to it (−₹550).`);return true;}
 return false;
}
function tick(){later(()=>{const b=S.booking;if(!b)return;const ids=activeIds();if(ids[b.step]==='stay'&&!b.resolved){b.conflict=true;render();const a=document.getElementById('app');a.scrollTop=a.scrollHeight;return;}b.step++;if(b.step>=ids.length){render();later(()=>{S.route='done';render();},600);return;}render();tick();},550);}

document.addEventListener('click',e=>{
 const t=e.target.closest('[data-t]');if(t){const v=t.dataset.t;if(v==='menu'){menuOpen=!menuOpen;}else{view=v;}renderTool();return;}
 const j=e.target.closest('[data-j]');if(j){menuOpen=false;clearT();S=fresh();JUMPS[+j.dataset.j][1]();render();return;}
 if(menuOpen&&!e.target.closest('.menu')){menuOpen=false;renderTool();}
 const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const f=ACT[b.dataset.a];if(f)f(b.dataset.v);
});
const P15='₹15K, this weekend, travelling alone. Somewhere calm by the sea.';
const JUMPS=[
 ['Solo trip'],
 ['01 · Home (entry point)',()=>{}],
 ['02 · Follow-up questions',()=>{S.prompt=P15;S.route='clarify';}],
 ['03 · Planning',()=>{S.prompt=P15;ACT.plan();}],
 ['04 · Trippy’s plan',()=>{S.prompt=P15;S.route='results';}],
 ['05 · Why this: late arrival by area',()=>{S.prompt=P15;S.route='results';S.open.add('out');}],
 ['05b · Route map, after dark',()=>{S.prompt=P15;S.route='results';S.night=true;S.mapDay='all';}],
 ['06 · Explore all stays',()=>{S.prompt=P15;S.route='results';S.sheet={id:'stay'};}],
 ['07 · Cleartrip packages',()=>{S.prompt=P15;S.route='results';S.tab='pkg';}],
 ['08 · Book it yourself',()=>{S.prompt=P15;S.route='results';S.tab='sep';S.picks=new Set(['out:2','stay:0']);S.checked=true;}],
 ['09 · Back by sunset',()=>{S.prompt=P15;S.prefs.late='sunset';S.choice.out=1;S.route='results';}],
 ['10 · Over budget',()=>{S.prompt=P15;S.route='results';S.choice.stay=2;}],
 ['11 · Nothing fits',()=>{S.prompt='₹5K, anywhere, this weekend.';S.budget=5000;S.route='nofit';}],
 ['12 · Sold out mid-booking',()=>{S.prompt=P15;S.route='booking';S.booking={step:1,conflict:true,resolved:false};}],
 ['13 · Booked',()=>{S.route='done';}],
 ['Group of friends'],
 ['14 · Invite friends',()=>{S.who='group';S.route='ginvite';}],
 ['15 · What works for everyone',()=>{S.who='group';S.tanvi=true;S.route='gsync';}],
 ['16 · Vote',()=>{S.who='group';S.tanvi=true;S.route='gvote';}],
 ['17 · Group plan',()=>{S.who='group';S.tanvi=true;S.vote='p';S.route='gplan';}],
 ['18 · Sent to the group',()=>{S.route='gdone';}]
];
/* deep links: #state=4&view=phone */
(()=>{const h=new URLSearchParams(location.hash.slice(1));if(h.get('view'))view=h.get('view');const st=+h.get('state');if(st){const list=JUMPS.filter(j=>j[1]);const j=list.find(x=>x[0].startsWith(String(st).padStart(2,'0')));if(j)j[1]();}if(h.get('night'))S.night=true;if(h.get('day'))S.mapDay=h.get('day');if(h.get('tab'))S.tab=h.get('tab');if(h.get('export')){document.body.innerHTML='<div id="export">'+mapSvg({day:h.get('day')||'sat',night:!!h.get('night')})+'</div>';window.__export=1;}})();
if(!window.__export)render();
</script>
